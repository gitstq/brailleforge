[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brailleforge"
version = "1.0.0"
description = "Offline, zero-dependency Grade 1 braille toolkit: text / Unicode braille / dot notation / Braille ASCII / BRF conversion, inspection and emboss-ready formatting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["braille", "accessibility", "brf", "braille-ascii", "cli", "zero-dependency"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing",
  "Environment :: Console",
]

[project.scripts]
brailleforge = "brailleforge.cli:main"

[tool.setuptools]
packages = ["brailleforge"]
